name: "Zimperium zScan"
description: "Scan your iOS & Android mobile app binaries to identify security, privacy and compliance-related issues. Free Trial Available"
author: "Zimperium"

inputs:
  console_url: # REPLACE: Zimperium Console URL
    required: false
    description: "Zimperium Console URL"
    # default: "${{ vars.ZSCAN_CONSOLE_URL }}"
  client_env: # DEPRECATED: Zimperium Environment Name *IF* Console URL is not provided
    required: false
    description: "DEPRECATED: Zimperium Console Client Environment Mnemonic"
    #default: "${{ vars.ZSCAN_CLIENT_ENV }}"
  client_id: # REPLACE: Zimperium Client ID
    required: true
    description: "zScan API Client ID"
    # default: "${{ vars.ZSCAN_CLIENT_ID }}"
  client_secret:
    required: true
    description: "zScan API Client Secret"
    # default: " ${{ secrets.ZSCAN_CLIENT_SECRET }}"
  app_file:
    required: true
    description: "APK or IPA File(s) to Scan"
    #default: "${{ steps.apk-path.outputs.path }}"
  team_name:
    required: false
    description: "Team name to assign the app to (default: Default)"
    default: "Default"
  report_format:
    required: false
    description: "Report format(s) to download: json, sarif, pdf, comma-separated list (e.g. 'sarif, pdf'), or 'all' (default: sarif)"
    default: "sarif"
  fail_on_scan_findings:
    required: false
    description: "Fail the workflow when scan findings meet the configured criteria"
    default: "false"
  scan_evaluation_mode:
    required: false
    description: "Scan evaluation mode: any_finding or unaccepted_finding_only (default: any_finding)"
    default: "any_finding"
  minimum_severity:
    required: false
    description: "Minimum severity for scan evaluation: informational, low, medium, high, or critical (default: low)"
    default: "low"
  retry_attempts:
    required: false
    description: "Maximum attempts for transient upload/API failures, 1-10 (default: 3)"
    default: "3"
  retry_delay_seconds:
    required: false
    description: "Initial delay between retry attempts in seconds, 0-60 (default: 5)"
    default: "5"
  retry_backoff_factor:
    required: false
    description: "Exponential backoff multiplier applied between retries, 1-5 (default: 2)"
    default: "2"
  status_timeout_minutes:
    required: false
    description: "Maximum time to wait for zScan analysis to complete, in minutes, 1-360 (default: 45)"
    default: "45"
  status_poll_interval_seconds:
    required: false
    description: "Interval between assessment status checks in seconds, 5-300 (default: 30)"
    default: "30"
  report_timeout_minutes:
    required: false
    description: "Maximum time to wait for each report to become downloadable, in minutes, 1-180 (default: 20)"
    default: "20"
  report_poll_interval_seconds:
    required: false
    description: "Interval between report download attempts in seconds, 1-120 (default: 6)"
    default: "6"

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: alert-octagon
  color: blue
